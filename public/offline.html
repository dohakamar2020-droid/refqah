<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال — رِفقة الأربعين</title>
    <meta name="theme-color" content="#F9EFF2" />
    <style>
      :root {
        --blush: #f9eff2;
        --powder: #f0dce3;
        --dusty: #ddb8c5;
        --deep: #995c74;
        --muted: #7c6a70;
        --ivory: #fffaf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--blush);
        color: var(--deep);
        font-family: "Tajawal", "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 26rem;
        background: var(--ivory);
        border: 1px solid var(--powder);
        border-radius: 1.75rem;
        padding: 2.5rem 2rem;
        box-shadow: 0 10px 30px rgba(153, 92, 116, 0.08);
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
        display: block;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.8;
        font-size: 0.95rem;
      }
      button {
        margin-top: 1.5rem;
        background: var(--dusty);
        color: #fff;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.75rem;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { background: var(--deep); }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="22" fill="#F0DCE3" />
        <path
          d="M24 10c-6 4-9 8-9 14s3 10 9 14c6-4 9-8 9-14s-3-10-9-14Z"
          fill="#DDB8C5"
        />
        <path
          d="M24 18c0 4-3 5-6 5 0-3 3-5 6-5Zm0 0c0 4 3 5 6 5 0-3-3-5-6-5Z"
          fill="#995C74"
          opacity="0.55"
        />
        <circle cx="24" cy="30" r="2.5" fill="#995C74" />
      </svg>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        تعذّر فتح هذه الصفحة الآن. تحقّقي من الاتصال ثم أعيدي المحاولة — محفوظاتكِ
        وتقدّمكِ بأمان ولن يتأثرا.
      </p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
